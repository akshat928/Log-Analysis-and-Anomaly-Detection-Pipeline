# Detector thresholds. Keys match detector function names in log_pipeline/detectors.py.

auth:
  brute_force:
    threshold: 5        # failed logins from one IP
    window: "5min"
  success_after_failures:
    min_failures: 3
    window: "10min"
  off_hours_login:
    start_hour: 22      # 10 PM
    end_hour: 6         # 6 AM

access:
  request_rate_outliers:
    z_threshold: 3.0
    min_requests: 20
  error_bursts:
    threshold: 10       # 4xx responses from one IP
    window: "1min"
